# Правим YOUR_DOMAIN и путь /opt/colorbox под реальный сервер, кладём в
# /etc/nginx/sites-available/colorbox, симлинкуем в sites-enabled, nginx -t && systemctl reload nginx.
#
# Дальше: `certbot --nginx -d YOUR_DOMAIN` — сам допишет 443/ssl_certificate и
# редирект с 80 на 443. Руками HTTPS здесь не прописываем, чтобы не разъезжаться
# с тем, что заведёт certbot (и с автопродлением сертификата).

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    # Должен быть >= MAX_UPLOAD_BYTES в utils.py (сейчас 15 МБ) — иначе nginx сам
    # отбивает фото 413-й ошибкой ещё до того, как запрос дойдёт до приложения.
    client_max_body_size 16m;

    # CSS/JS отдаём напрямую с диска — не грузим ими Python-процесс.
    # /static/uploads/ (фото заказов и смен) — НЕ здесь и намеренно: раздача фото
    # проверяет права по филиалу (main.py: serve_uploaded_photo), поэтому идёт через
    # location / в приложение, а не отдаётся с диска напрямую в обход этой проверки.
    location /static/css/ {
        alias /opt/colorbox/static/css/;
        expires 7d;
        add_header Cache-Control "public";
    }
    location /static/js/ {
        alias /opt/colorbox/static/js/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Критично для secure-флага на cookie сессии (main.py) — без этого приложение
        # никогда не увидит "https" и cookie останется без Secure даже под TLS.
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}