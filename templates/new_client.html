{% extends "base.html" %}

{% block title %}Новый клиент - Colorist CRM{% endblock %}

{% block content %}
<div class="card" style="max-width: 500px; margin: 0 auto;">
    <h2 class="card-form-title">Новый клиент</h2>

    <form action="/new-client" method="post" class="form-stack">
        <div>
            <label class="field-label">Имя клиента (ФИО или СТО)</label>
            <input type="text" name="client_name" required="required" placeholder="Например: Иванов Иван или Гараж-55" class="form-input" />
        </div>

        <div>
            <label class="field-label">Филиал</label>
            <select disabled style="width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #bdc3c7; margin-top: 5px; box-sizing: border-box; background: #f4f4f9; color: #2c3e50; font-weight: bold;">
                <option>{{ branch.name if branch else "Филиал не назначен" }}</option>
            </select>
            <input type="hidden" name="branch_id" value="{{ branch.id if branch else '' }}">
        </div>

        <div class="form-actions">
            <a href="/clients" class="link-muted">Отмена</a>
            <button type="submit" class="btn-primary">Сохранить</button>
        </div>
    </form>
</div>
{% endblock %}
