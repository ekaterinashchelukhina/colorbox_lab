{% extends "base.html" %}

{% block title %}Новый заказ - Colorist CRM{% endblock %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 0 auto;">
    <h2 style="color: #2c3e50; margin-top: 0; border-bottom: 2px solid #ecf0f1; padding-bottom: 10px;">Оформление нового заказа</h2>

    <form action="/new-order" method="post" enctype="multipart/form-data" style="display: flex; flex-direction: column; gap: 15px; margin-top: 20px;" id="new-order-form">
        <input type="hidden" name="client_time" id="client_time_input_new_order">

        <div>
            <label style="font-size: 13px; font-weight: bold; color: #34495e;">Имя клиента (ФИО или СТО)</label>
            <input type="text" name="client_name" required="required" placeholder="Например: Иванов Иван или Гараж-55" style="width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #bdc3c7; margin-top: 5px; box-sizing: border-box;" />
        </div>

        <div style="display: flex; gap: 15px;">
            <div style="flex: 1;">
                <label style="font-size: 13px; font-weight: bold; color: #34495e;">Марка автомобиля</label>
                <input type="text" name="car" required="required" style="width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #bdc3c7; margin-top: 5px; box-sizing: border-box;" />
            </div>
            <div style="flex: 1;">
                <label style="font-size: 13px; font-weight: bold; color: #34495e;">Код краски (необязательно)</label>
                <input type="text" name="paint_code" style="width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #bdc3c7; margin-top: 5px; box-sizing: border-box;" />
            </div>
        </div>

        <div>
            <label style="font-size: 13px; font-weight: bold; color: #34495e;">Деталь (образец)</label>
            <select name="detail" required="required" style="width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #bdc3c7; margin-top: 5px; background: white; box-sizing: border-box;">
                <option value="Лючок бензобака">Лючок бензобака</option>
                <option value="Крыло">Крыло</option>
                <option value="Дверь">Дверь</option>
                <option value="Автомобиль">Автомобиль</option>
                <option value="Капот">Капот</option>
                <option value="Бампер">Бампер</option>
                <option value="Другое">Другое</option>
                <option value="Без детали">Без детали</option>
            </select>
        </div>

        <div>
            <label style="font-size: 13px; font-weight: bold; color: #34495e;">Тип услуги</label>
            <select name="service_type" required="required" style="width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #bdc3c7; margin-top: 5px; background: white; box-sizing: border-box;">
                <option value="Подбор">Подбор</option>
                <option value="Слив по коду">Слив по коду</option>
                <option value="Экспресс-подбор">Экспресс-подбор</option>
                <option value="Готовая автоэмаль">Готовая автоэмаль (банка)</option>
            </select>
        </div>

        <!-- Поле для комментария менеджера при создании -->
        <div>
            <label style="font-size: 13px; font-weight: bold; color: #34495e;">Комментарий для колориста</label>
            <textarea name="manager_comment" rows="2" placeholder="Например: Клиент просил подобрать точь-в-точь по лючку..." style="width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #bdc3c7; margin-top: 5px; box-sizing: border-box; resize: vertical; font-family: inherit; font-size: 14px;"></textarea>
        </div>

        <div style="background: #fdf2e9; padding: 15px; border-radius: 5px; border: 1px solid #e67e22;">
            <label style="font-size: 13px; font-weight: bold; color: #d35400;">Фотография детали (Лючок)</label>
            <p style="font-size: 11px; margin: 5px 0 10px 0; color: #e67e22;">Обязательно для услуг «Подбор» и «Экспресс-подбор».</p>
            <input type="file" name="file" accept="image/*" capture="environment" style="width: 100%; font-size: 14px;" />
        </div>

        <div style="display: flex; gap: 15px;">
            <div style="flex: 1;">
                <label style="font-size: 13px; font-weight: bold; color: #34495e;">Требуемый объем (мл)</label>
                <input type="number" step="1" name="target_volume" required="required" style="width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #bdc3c7; margin-top: 5px; box-sizing: border-box;" />
            </div>
            <div style="flex: 1;">
                <label style="font-size: 13px; font-weight: bold; color: #34495e;">Дедлайн (дата выдачи)</label>
                <input type="date" name="deadline" required="required" style="width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #bdc3c7; margin-top: 5px; box-sizing: border-box;" />
            </div>
        </div>

        <div style="display: flex; justify-content: space-between; margin-top: 15px; align-items: center;">
            <a href="/dashboard" style="color: #7f8c8d; text-decoration: none; font-weight: bold;">Отмена</a>
            <button type="submit" style="background: #2ecc71; color: white; border: none; padding: 12px 25px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 16px;">Создать заказ</button>
        </div>
    </form>
</div>

<script>
    // Фиксируем локальное время устройства прямо перед отправкой формы создания заказа
    const newOrderForm = document.getElementById('new-order-form');
    if (newOrderForm) {
        newOrderForm.addEventListener('submit', function() {
            const now = new Date();
            const offsetMs = now.getTimezoneOffset() * 60 * 1000;
            const localIso = new Date(now.getTime() - offsetMs).toISOString().slice(0, 19);
            document.getElementById('client_time_input_new_order').value = localIso;
        });
    }
</script>
{% endblock %}
