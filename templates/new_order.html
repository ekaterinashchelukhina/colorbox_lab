{% extends "base.html" %}

{% block title %}Новый заказ - Colorist CRM{% endblock %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 0 auto;">
    <h2 class="card-form-title">Оформление нового заказа</h2>

    <form action="/new-order" method="post" enctype="multipart/form-data" class="form-stack" id="new-order-form">
        <div>
            <label class="field-label">Имя клиента (ФИО или СТО)</label>
            <input type="text" name="client_name" required="required" list="clients-datalist" autocomplete="off" placeholder="Например: Иванов Иван или Гараж-55" class="form-input" />
            <datalist id="clients-datalist">
                {% for c in clients %}
                <option value="{{ c.name }}"></option>
                {% endfor %}
            </datalist>
        </div>

        <div class="form-row">
            <div class="form-col">
                <label class="field-label">Марка автомобиля</label>
                <input type="text" name="car" required="required" class="form-input" />
            </div>
            <div class="form-col">
                <label class="field-label">Код краски</label>
                <input type="text" name="paint_code" class="form-input optional-hint-input" placeholder="необязательно" />
            </div>
        </div>

        <div>
            <label class="field-label">Деталь (образец)</label>
            <select name="detail" required="required" class="form-select">
                <option value="Лючок бензобака">Лючок бензобака</option>
                <option value="Крыло">Крыло</option>
                <option value="Дверь">Дверь</option>
                <option value="Автомобиль">Автомобиль</option>
                <option value="Капот">Капот</option>
                <option value="Бампер">Бампер</option>
                <option value="Другое">Другое</option>
                <option value="Без детали">Без детали</option>
            </select>
        </div>

        <div>
            <label class="field-label">Тип услуги</label>
            <select name="service_type" required="required" class="form-select">
                <option value="Подбор">Подбор</option>
                <option value="Слив по коду">Слив по коду</option>
                <option value="Экспресс-подбор">Экспресс-подбор</option>
                <option value="Готовая автоэмаль">Готовая автоэмаль (банка)</option>
            </select>
        </div>

        <!-- Поле для комментария менеджера при создании -->
        <div>
            <label class="field-label">Комментарий для колориста</label>
            <textarea name="manager_comment" rows="2" placeholder="Например: Клиент просил подобрать точь-в-точь по лючку..." style="width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #bdc3c7; margin-top: 5px; box-sizing: border-box; resize: vertical; font-family: inherit; font-size: 14px;"></textarea>
        </div>

        <div style="background: #fdf2e9; padding: 15px; border-radius: 5px; border: 1px solid #e67e22;">
            <label style="font-size: 13px; font-weight: bold; color: #d35400;">Фотография детали (Лючок)</label>
            <p style="font-size: 11px; margin: 5px 0 10px 0; color: #e67e22;">Обязательно для услуг «Подбор» и «Экспресс-подбор».</p>
            <label class="upload-zone" id="detail-photo-zone">
                <span id="detail-photo-zone-text">📸 Сделать фото / выбрать файл</span>
                <input type="file" name="file" accept="image/*" capture="environment" id="detail-photo-input" />
            </label>
        </div>

        <div class="form-row">
            <div class="form-col">
                <label class="field-label">Требуемый объем (мл)</label>
                <input type="number" step="1" min="1" name="target_volume" required="required" class="form-input" />
            </div>
            <div class="form-col">
                <label class="field-label">Дедлайн (дата выдачи)</label>
                <input type="date" name="deadline" required="required" class="form-input" />
            </div>
        </div>

        <div class="form-actions">
            <a href="/dashboard" class="link-muted">Отмена</a>
            <button type="submit" class="btn-primary">Создать заказ</button>
        </div>
    </form>
</div>

<script>
    (function () {
        var input = document.getElementById('detail-photo-input');
        var zone = document.getElementById('detail-photo-zone');
        var text = document.getElementById('detail-photo-zone-text');
        if (!input) return;

        input.addEventListener('change', function () {
            if (input.files && input.files.length > 0) {
                zone.classList.add('is-filled');
                text.textContent = '✅ Фото готово: ' + input.files[0].name;
            } else {
                zone.classList.remove('is-filled');
                text.textContent = '📸 Сделать фото / выбрать файл';
            }
        });
    })();
</script>
{% endblock %}
