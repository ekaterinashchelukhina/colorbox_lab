<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{% block title %}Colorist CRM{% endblock %}</title>

    <!-- Собрано локально из static/css/tailwind-input.css (см. package.json, "npm run build:css") —
         больше не зависит от cdn.tailwindcss.com в рантайме. -->
    <link rel="stylesheet" href="/static/css/tailwind.css?v={{ asset_version('static/css/tailwind.css') }}">

    <!-- Стили для страниц, ещё не переведённых на Tailwind (см. static/css/legacy.css).
         ?v=mtime — чтобы браузер не отдавал закэшированную версию после правок вёрстки. -->
    <link rel="stylesheet" href="/static/css/legacy.css?v={{ asset_version('static/css/legacy.css') }}">
</head>
<body class="bg-[#f4f4f9] text-gray-800 font-sans m-0 min-h-screen flex flex-col">

    <!-- Адаптивная шапка на Tailwind -->
    <header class="bg-[#2c3e50] text-white px-4 sm:px-6 py-4 flex flex-wrap justify-between items-center shadow-md gap-3">
        <div class="flex items-center">
            <!-- Логотип-ссылка: /dashboard сам редиректит на нужную панель по роли (директор/менеджер/колорист) -->
            <a href="/dashboard" class="flex items-center gap-2 text-lg font-bold hover:opacity-90 transition-opacity" title="К рабочей панели">
                <svg viewBox="0 0 100 100" class="w-7 h-7 flex-shrink-0" aria-hidden="true">
                    <polygon points="50,2 97,26 97,74 50,98 3,74 3,26" fill="#ffffff"/>
                    <path d="M50,50 L50,2 M50,50 L97,74 M50,50 L3,74" stroke="#2c3e50" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                ColorBox<span class="text-[#2ecc71] ml-1">Lab</span>
            </a>
            <span class="font-normal opacity-80 text-sm hidden sm:inline ml-2">| Лаборатория автоэмалей</span>
        </div>
        <div class="flex items-center gap-4">
            <span class="text-sm hidden sm:inline">Привет, {{ username or "Коллега" }}!</span>
            <a href="/logout" class="bg-[#e74c3c] hover:bg-[#c0392b] text-white font-bold py-2 px-4 rounded-md transition-colors shadow-sm text-sm">
                Выйти
            </a>
        </div>
    </header>

    <!-- Основной контейнер, который отцентрирует всё содержимое -->
    <main class="flex-1 w-full flex justify-center p-4 sm:p-8">
        <div class="w-full max-w-7xl">
            {% block content %}{% endblock %}
        </div>
    </main>

    <!-- Перевод времени из UTC в часовой пояс браузера (см. static/js/local-time.js) -->
    <script src="/static/js/local-time.js?v={{ asset_version('static/js/local-time.js') }}"></script>
</body>
</html>
