<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{% block title %}Colorist CRM{% endblock %}</title>

    <!-- Подключаем HTMX -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/htmx/1.9.10/htmx.min.js"></script>
    <!-- Подключаем Tailwind CSS (исправляет проблему с дизайном) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Оставляем старые стили для обратной совместимости с непереведенными страницами -->
    <style>
        /* --- Стили для карточек и таблиц (Дашборд) --- */
        .card { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); width: 100%; max-width: 1200px; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .card-header h2 { margin: 0; color: #2c3e50; }
        .btn-new { background: #27ae60; color: white; padding: 10px 15px; text-decoration: none; border-radius: 5px; font-weight: bold; font-size: 14px; }
        .btn-new:hover { background: #219150; }

        .table-responsive { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { padding: 12px 10px; text-align: left; border-bottom: 1px solid #eee; }
        th { background-color: #2c3e50; color: white; white-space: nowrap; }
        tr:hover { background-color: #f8f9fa; }
        .status { padding: 5px 10px; border-radius: 12px; font-size: 11px; font-weight: bold; background: #f39c12; color: white; text-transform: uppercase; }

        /* Класс, чтобы текст не переносился на новую строку */
        .nowrap { white-space: nowrap; }

        /* --- Стили для форм (Новый заказ) --- */
        .form-box { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 450px; }
        .form-box h2 { margin-top: 0; color: #2c3e50; border-bottom: 2px solid #ecf0f1; padding-bottom: 10px; }
        .section-title { font-size: 16px; color: #7f8c8d; margin-top: 20px; margin-bottom: 10px; font-weight: bold; text-transform: uppercase; }
        label { font-weight: bold; font-size: 14px; display: block; margin-top: 15px; color: #333; }
        input { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .btn-submit { background: #27ae60; color: white; border: none; padding: 12px; width: 100%; border-radius: 5px; margin-top: 25px; cursor: pointer; font-size: 16px; font-weight: bold; }
        .btn-submit:hover { background: #219150; }
        .btn-cancel { display: block; text-align: center; margin-top: 15px; color: #7f8c8d; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body class="bg-[#f4f4f9] text-gray-800 font-sans m-0 min-h-screen flex flex-col">

    <!-- Адаптивная шапка на Tailwind -->
    <header class="bg-[#2c3e50] text-white px-4 sm:px-6 py-4 flex flex-wrap justify-between items-center shadow-md gap-3">
        <div class="text-lg font-bold flex items-center">
            ColorBox Lab <span class="font-normal opacity-80 text-sm hidden sm:inline ml-2">| Лаборатория автоэмалей</span>
        </div>
        <div class="flex items-center gap-4">
            <span class="text-sm hidden sm:inline">Привет, {{ request.cookies.get("username", "Коллега") }}!</span>
            <a href="/logout" class="bg-[#e74c3c] hover:bg-[#c0392b] text-white font-bold py-2 px-4 rounded-md transition-colors shadow-sm text-sm">
                Выйти
            </a>
        </div>
    </header>

    <!-- Основной контейнер, который отцентрирует всё содержимое -->
    <main class="flex-1 w-full flex justify-center p-4 sm:p-8">
        <div class="w-full max-w-7xl">
            {% block content %}{% endblock %}
        </div>
    </main>

    <!-- Скрипт для автоматического перевода времени из UTC в локальное время пользователя -->
    <script>
    document.addEventListener("DOMContentLoaded", function() {
        document.querySelectorAll(".local-time").forEach(function(el) {
            var utcTime = el.getAttribute("data-utc");
            if (utcTime) {
                // Буква 'Z' на конце дает браузеру понять, что это время по Гринвичу (UTC)
                var date = new Date(utcTime + "Z");

                // Браузер сам переведет время в часовой пояс устройства
                el.textContent = date.toLocaleString('ru-RU', {
                    day: '2-digit',
                    month: '2-digit',
                    year: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });
            }
        });
    });
    </script>
</body>
</html>
