<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Вход - Colorist CRM</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f4f4f9] flex items-center justify-center min-h-screen m-0 font-sans">

    <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-md mx-4 border border-gray-200 text-center">

        <h2 class="text-2xl font-bold text-[#2c3e50] mb-6">Лаборатория</h2>

        <!-- Обычная классическая форма -->
        <form action="/login" method="post" class="space-y-4">

            <div>
                <input type="text" name="username" placeholder="Логин (например, director)" required
                       class="w-full p-4 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#3498db] focus:outline-none text-lg">
            </div>

            <div>
                <!-- Тип password скроет токен точками -->
                <input type="password" name="token" placeholder="Токен доступа" required
                       class="w-full p-4 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#3498db] focus:outline-none text-lg font-mono">
            </div>

            <button type="submit"
                    class="w-full bg-[#2c3e50] hover:bg-[#1a252f] text-white font-bold py-4 rounded-lg text-lg shadow-md transition-colors mt-2">
                Войти
            </button>

        </form>

        <!-- Блок для вывода ошибок через шаблонизатор Jinja2 -->
        {% if error_message %}
        <div class="text-red-500 mt-4 text-sm font-medium">{{ error_message }}</div>
        {% endif %}

    </div>

</body>
</html>
